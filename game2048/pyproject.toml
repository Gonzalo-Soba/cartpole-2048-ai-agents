[tool.poetry]
name = "game2048-search"
version = "1.0.0"
description = "Minimax con poda alpha-beta y Expectimax para 2048"
authors = ["Gonzalo Soba"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
numpy = "^2.1"
matplotlib = "^3.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
ipykernel = "^6.30"
pandas = "^2.2"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
